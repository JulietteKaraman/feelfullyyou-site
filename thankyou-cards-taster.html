<style>
  :root{
    --cream:#fefcfa;
    --ink:#1c1714;
    --brown:#5d4a33;
    --gold:#a88538;
    --gold-deep:#99680c;
    --gold-soft:#b4a074;
    --gold-pale:#ddc98e;
    --teal:#0d3535;
    --teal-deep:#061a1a;
    --line:#e3dccf;
    --display:'Poppins',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--brown);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

  /* TOPBAR */
  .topbar{background:var(--teal);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .topbar .brand{font-family:var(--display);font-weight:700;font-size:15px;color:#fff;letter-spacing:.02em;text-decoration:none}
  .topbar .brand b{color:var(--gold-pale)}

  /* MAIN */
  .main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:52px 24px 60px}
  .card{max-width:480px;width:100%}

  /* CONFIRM */
  .confirm{text-align:center;margin-bottom:48px}
  .check{width:56px;height:56px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  .check svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin-bottom:12px}
  h1{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700;color:var(--teal);line-height:1.1;letter-spacing:-.02em;margin-bottom:12px}
  .confirm .sub{font-size:1rem;color:var(--brown);line-height:1.7}

  /* CTA */
  .cta-wrap{text-align:center;margin-bottom:48px}
  .phone{text-align:center;margin:8px 0 28px}
  .phone img{width:min(280px,72vw);height:auto}
  .cta{display:block;width:100%;padding:18px 24px;background:var(--teal);color:#fff;font-family:var(--display);font-size:1.1rem;font-weight:700;border-radius:3px;text-decoration:none;letter-spacing:-.01em;transition:background .2s}
  .cta:hover{background:var(--teal-deep)}
  .cta-note{font-size:12px;color:var(--gold-soft);margin-top:10px}

  /* HOW IT WORKS */
  .how{border-top:1px solid var(--line);padding-top:36px}
  .how .label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin-bottom:22px}
  .rule{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--line)}
  .rule:last-child{border-bottom:none}
  .rule .num{font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--gold-pale);line-height:1;min-width:28px;padding-top:2px}
  .rule .copy h3{font-family:var(--display);font-size:1rem;font-weight:700;color:var(--teal);margin-bottom:5px;letter-spacing:-.01em}
  .rule .copy p{font-size:0.94rem;color:var(--brown);line-height:1.65}
  .rule .copy p strong{color:var(--ink);font-weight:600}

  /* THREE RESPONSES */
  .responses{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .response{background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 14px;display:flex;gap:12px;align-items:center}
  .response .tag{font-family:var(--display);font-size:0.82rem;font-weight:700;color:var(--teal);white-space:nowrap}
  .response .desc{font-size:0.82rem;color:var(--brown);line-height:1.5}

  /* EMAIL NOTE */
  .email-note{margin-top:36px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:3px;font-size:0.88rem;color:var(--brown);line-height:1.6;text-align:center}
  .email-note strong{color:var(--teal)}

  footer{padding:22px 28px;text-align:center;font-size:12px;color:var(--gold-soft);flex-shrink:0}
  footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}
</style>

<body>

<div class="topbar">
  <a href="/" class="brand">Feel Fully <b>You</b></a>
</div>

<main class="main">
  <div class="card">

    <!-- CONFIRMATION (24 Oct 2026, Juliette: no Dyad explanation here, the app
         explains it. A picture of the app, one button, straight in.) -->
    <div class="confirm">
      <div class="check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="eyebrow">You're in</div>
      <h1>This is what opens on your phone.</h1>
      <p class="sub">Six free cards. Tap one and the app shows you what to do.</p>
    </div>

    <div class="phone"><img src="/media/cards-app-sitting-iphone.png" alt="The cards app on a phone: one card, a fifteen minute timer, and the three answers, Thank you, Clarify that, Summarise that" width="280" height="615"></div>

    <div class="cta-wrap">
      <a href="https://feelfullyyou.com/my-cards/" class="cta">Open my free cards &rarr;</a>
      <p class="cta-note">Opens in your browser. Nothing to download. The link is in your inbox too.</p>
    </div>
  </div>
</main>

<footer>
  <a href="/cards">See the full deck</a> &nbsp;·&nbsp; <a href="mailto:support@feelfullyyou.com">support@feelfullyyou.com</a>
</footer>

<script>
document.addEventListener('click', function(e){
  var a = e.target.closest('a'); if(!a || typeof gtag !== 'function') return;
  var h = a.href || '';
  var label = (a.textContent || '').trim().slice(0, 60);
  if (h.indexOf('stripe.com') > -1) gtag('event', 'begin_checkout', {link_url: h, link_text: label, page_path: location.pathname});
  else if (h.indexOf('tidycal.com') > -1) gtag('event', 'book_call_click', {link_url: h, link_text: label, page_path: location.pathname});
  else if (h.indexOf('instagram.com') > -1) gtag('event', 'instagram_click', {link_url: h, page_path: location.pathname});
  else if (h.indexOf('/files/') > -1 || h.indexOf('.pdf') > -1) gtag('event', 'freebie_download', {link_url: h, page_path: location.pathname});
});
</script>
