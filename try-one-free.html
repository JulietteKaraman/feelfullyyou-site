<style>
  :root{--cream:#fefcfa;--ink:#070707;--gold:#a88538;--teal:#0d3535}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:#4a3d2c;font-family:'Inter',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .top{background:var(--teal);height:60px;display:flex;align-items:center;padding:0 24px}
  .top a{font-family:'Poppins',sans-serif;font-weight:700;color:var(--cream);text-decoration:none}
  .top a b{color:#ddc98e}
  .wrap{max-width:560px;margin:0 auto;padding:40px 24px 64px;text-align:center}
  .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:14px}
  h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(2rem,7vw,2.6rem);line-height:1.08;color:var(--ink);letter-spacing:-.02em;margin-bottom:16px}
  h1 em{font-style:italic;color:var(--gold)}
  .sub{font-size:18px;margin-bottom:24px}
  .ph{width:100%;max-width:260px;aspect-ratio:4/5;object-fit:cover;object-position:center 45%;border-radius:14px;margin:0 auto 26px;display:block;box-shadow:0 20px 50px rgba(7,7,7,.16)}
  form{display:flex;flex-direction:column;gap:12px;text-align:left}
  label{font-size:14px;font-weight:600;color:var(--ink)}
  input{font:inherit;padding:14px 16px;border:1.5px solid #d9cfbd;border-radius:4px;background:#fff;width:100%}
  input:focus{outline:none;border-color:var(--gold)}
  button{font:inherit;font-weight:600;font-size:16px;background:var(--gold);color:#fff;border:0;border-radius:4px;padding:16px;cursor:pointer;margin-top:6px}
  button:disabled{opacity:.6}
  .small{font-size:13px;color:#7a6c58;margin-top:12px;text-align:center}
  .msg{margin-top:14px;font-weight:600}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SY8NKELMNZ"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-SY8NKELMNZ');</script>

<body>
<div class="top"><a href="/">Feel Fully <b>You</b></a></div>
<main class="wrap">
  <p class="kick">31 Touch Points &middot; the first one is free</p>
  <h1>Try one <em>tonight.</em></h1>
  <p class="sub">Three minutes, a strawberry, and my voice walking you both through it. One of you leads. One of you receives.</p>
  <img class="ph" src="media/tp-taste-itv-poster.jpg" alt="A couple trying The Fruit Touch Point, one feeding the other a strawberry">
  <form id="f" novalidate>
    <label for="n">Your first name</label>
    <input id="n" name="firstName" autocomplete="given-name" required>
    <label for="e">Your email</label>
    <input id="e" name="email" type="email" autocomplete="email" required>
    <div class="hp" aria-hidden="true"><input id="hp" tabindex="-1" autocomplete="off"></div>
    <button id="b" type="submit">Send it to me</button>
  </form>
  <p class="msg" id="m" hidden></p>
  <p class="small">It opens straight away, and I'll email it to you too so you have it for tonight.</p>
</main>
<script>
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var name=document.getElementById('n').value.trim(),email=document.getElementById('e').value.trim(),b=document.getElementById('b'),m=document.getElementById('m');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){m.textContent='Pop in a full email address and try again.';m.hidden=false;return;}
  b.disabled=true;b.textContent='Sending...';
  fetch('/.netlify/functions/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:email,firstName:name,hp_field:document.getElementById('hp').value,tagIds:[26235735],sequenceIds:[2949146]})})
  .then(function(r){if(!r.ok)throw new Error(r.status);
    if(typeof gtag==='function')gtag('event','generate_lead',{form:'try-one-free'});
    window.location.href='https://app.feelfullyyou.com/taste/31-touch-points';})
  .catch(function(){b.disabled=false;b.textContent='Send it to me';m.textContent="That didn't go through. Try again, or email support@feelfullyyou.com and I'll send it to you.";m.hidden=false;});
});
</script>
</body>
</html>
