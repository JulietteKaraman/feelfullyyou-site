<style>
/* Restyled to match the dark "Where did the touch go?" quiz: full-bleed black and white photos, thin segmented bars, gold italic, tap pills, cream cards */
:root{
  --bg:#070707; --cream:#fefcfa; --ink:#1c1714; --teal:#0D3535; --gold:#DDC98E; --gold-deep:#A88538; --brown:#7a6236; --lemon:#EEDE80;
  --txt:#F6EFE0; --foot:150px;
  --font:Poppins,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--lemon);outline-offset:3px}

.app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.ph{position:absolute;inset:-4%;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;filter:brightness(.72) contrast(1.04) grayscale(.85);transform:scale(1.04);transition:opacity 1s ease}
.ph.on{opacity:1}
.veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% 110%,rgba(7,7,7,.82) 25%,rgba(7,7,7,0) 68%),linear-gradient(180deg,rgba(7,7,7,.55) 0%,rgba(7,7,7,.2) 24%,rgba(7,7,7,.2) 100%);transition:background .6s}
.veil.deep{background:rgba(7,7,7,.62)}
.glow{position:absolute;left:50%;bottom:-30vh;width:120vw;height:70vh;transform:translateX(-50%);border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(194,154,78,.18),rgba(194,154,78,0))}

/* header strip and thin segmented bars */
.top{position:absolute;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 0;display:flex;align-items:center;gap:6px;z-index:4;height:calc(52px + env(safe-area-inset-top,0px))}
.back{flex:none;width:40px;height:40px;margin-left:-12px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--gold);cursor:pointer}
.back[hidden]{display:none}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.brand{font-weight:500;letter-spacing:.32em;font-size:.66rem;text-transform:uppercase;color:var(--gold)}
.stepno{margin-left:auto;font-weight:400;letter-spacing:.2em;font-size:.7rem;color:rgba(246,239,224,.9)}
.segs{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:22px;right:22px;display:flex;gap:5px;z-index:4}
.segs i{flex:1;height:1px;background:rgba(221,201,142,.22);transition:background .4s}
.segs i.on{background:var(--gold)}

/* the screen area scrolls, the button bar floats over it */
main{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top,0px));bottom:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 22px var(--foot);scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.sc{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;animation:qin .6s cubic-bezier(.2,.8,.2,1) both}
.sc>:first-child{margin-top:auto}
.sc>:last-child{margin-bottom:auto}
@keyframes qin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sc.top-aligned>:first-child{margin-top:0}

.k{font-weight:500;letter-spacing:.34em;font-size:.68rem;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 10px rgba(7,7,7,.8)}
h1,h2{font-weight:500;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 18px rgba(7,7,7,.55);text-wrap:balance}
h1:focus,h2:focus{outline:none}
h1 em,h2 em{font-style:italic;font-weight:500;color:var(--gold)}
h2.q{font-size:clamp(1.6rem,6.6vw,2.2rem);line-height:1.2;margin-top:12px}
p.sub{font-weight:400;font-size:1.02rem;color:rgba(246,239,224,.95);text-shadow:0 1px 12px rgba(7,7,7,.6);margin-top:14px;line-height:1.6}

/* tap answers, like the quiz */
.taps{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.tap{background:rgba(7,7,7,.55);border:1px solid rgba(221,201,142,.4);color:var(--txt);border-radius:30px;padding:14px 22px;min-height:52px;font:400 .95rem/1.4 var(--font);text-align:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .25s,color .25s,transform .2s,border-color .25s;-webkit-tap-highlight-color:transparent}
.tap:hover{border-color:var(--lemon)}
.tap[aria-checked="true"]{background:var(--gold);color:#070707;border-color:var(--gold)}
.taps .tap{animation:qin .5s cubic-bezier(.2,.8,.2,1) backwards}
.taps .tap:nth-child(2){animation-delay:.05s}.taps .tap:nth-child(3){animation-delay:.1s}.taps .tap:nth-child(4){animation-delay:.15s}

/* intro: the quiz's cream pop card */
.popcard{background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);text-align:center}
.popph{height:250px;background-size:cover;background-position:50% 72%;position:relative}
.popph::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:28px;background:linear-gradient(rgba(254,252,250,0),var(--cream))}
.popin{padding:14px 24px 26px;position:relative}
.popcard .k{text-shadow:none;color:var(--brown);font-weight:600;letter-spacing:.18em;font-size:.6rem}
.popcard h1{color:var(--teal);font-weight:600;text-shadow:none;font-size:1.9rem;line-height:1.1;margin:10px 0}
.popcard h1 em{color:var(--gold-deep);font-weight:600}
.popcard p.sub{color:var(--ink);text-shadow:none;font-size:.98rem;margin:0 0 14px}
.btn-g{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:14px 34px;font:600 .8rem var(--font);letter-spacing:.24em;text-transform:uppercase;cursor:pointer}
.popcard .btn-g{background:var(--teal);color:var(--cream);border-color:var(--teal)}

/* voice player, same as the quiz */
.vp{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-top:8px}
.vp-play{display:inline-flex;align-items:center;gap:10px;background:#f4f1ec;border:1px solid rgba(168,133,56,.5);color:var(--teal);border-radius:999px;padding:7px 16px 7px 7px;font:400 .86rem var(--font);cursor:pointer}
.vp-play img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.vp-play .ico{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#070707;align-items:center;justify-content:center;font-size:.62rem}
.vp-play .dur{opacity:.7;font-size:.76rem}
.vp-speed{display:flex;gap:6px}
.vp-speed button{background:none;border:1px solid rgba(168,133,56,.4);color:#5b4a2e;border-radius:999px;padding:3px 10px;font:400 .7rem var(--font);cursor:pointer}
.vp-speed button.on{background:var(--teal);color:var(--cream);border-color:var(--teal)}

/* made for you, plan, offer: cream cards */
.card{background:var(--cream);color:var(--ink);border-radius:22px;padding:24px 22px;box-shadow:0 30px 80px -24px rgba(0,0,0,.75);margin-top:18px}
.card .k{text-shadow:none;color:var(--brown);font-weight:600;letter-spacing:.26em;font-size:.62rem}
.card h3{font-weight:600;font-size:1.3rem;line-height:1.2;color:var(--teal);letter-spacing:-.01em;margin-top:6px}
.card h3.sm{font-size:1.05rem}
.made-card{text-align:center;padding:30px 24px}
.made-card h2{color:var(--teal);text-shadow:none;font-weight:600;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.12;margin-top:10px}
.made-card .lines{margin-top:20px}
.made-card .lines p{font-size:1.06rem;line-height:1.7;font-weight:400;color:var(--ink);margin-top:10px}
.made-card .close{margin-top:24px;padding-top:22px;border-top:1px solid rgba(168,133,56,.35);font-style:italic;font-weight:400;font-size:1.2rem;line-height:1.5;color:var(--gold-deep)}
.made-card .small{margin-top:22px;font-size:.84rem;font-weight:500;letter-spacing:.02em;color:var(--brown)}
.rv{opacity:0;animation:rv .7s ease forwards;animation-delay:calc(var(--i)*.4s + .1s)}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* app screens: floating phone mockups */
.apps .lines-plain{margin-top:14px;color:rgba(246,239,224,.95);font-size:1rem;line-height:1.55;font-weight:400;text-shadow:0 1px 12px rgba(7,7,7,.6)}
.apps .lines-plain span{display:block;margin-top:3px}
.mock{position:relative;width:min(70vw,270px);margin:34px auto 16px;transform:rotate(-3deg);animation:float 7s ease-in-out infinite}
.mock.r{transform:rotate(3deg)}
.mock::before{content:"";position:absolute;inset:-18% -28%;background:radial-gradient(closest-side,rgba(221,201,142,.34),rgba(221,201,142,0));z-index:-1;pointer-events:none}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.phone{border-radius:40px;padding:9px;background:linear-gradient(145deg,#3a332b,#0c0b0a 45%,#2a251f);box-shadow:0 0 0 1px rgba(221,201,142,.45),0 30px 70px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.06);position:relative}
.phone::before{content:"";position:absolute;top:16px;left:50%;width:30%;height:16px;margin-left:-15%;border-radius:10px;background:#050505;z-index:2}
.phone .screen{border-radius:32px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a0f0e,#0b0c0b)}
.phone img{display:block;width:100%;height:auto;padding-top:30px;background:#0a0f0e}

/* building */
.build{text-align:center}
.face{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 18px;border:1px solid rgba(221,201,142,.55);box-shadow:0 0 40px -6px rgba(221,201,142,.45)}
.bars{list-style:none;margin-top:30px;display:grid;gap:20px;text-align:left}
.bars .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.98rem;font-weight:400;color:#fff;margin-bottom:8px}
.tick{width:20px;height:20px;border-radius:50%;background:var(--gold);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s}
.tick svg{width:11px;height:11px;fill:none;stroke:#070707;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bars li.done .tick{opacity:1;transform:none}
.track{height:2px;border-radius:2px;background:rgba(254,252,250,.14);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold);transition:width .55s ease}
.bars li.fill .track i{width:100%}

/* email capture, like the quiz */
.mail form{margin-top:24px;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
.field input{width:100%;font-family:var(--font);font-weight:300;font-size:16px;padding:14px 18px;min-height:52px;background:rgba(7,7,7,.55);border:1px solid rgba(221,201,142,.4);border-radius:14px;color:#fff}
.field input::placeholder{color:rgba(254,252,250,.42)}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 1px rgba(221,201,142,.35),0 0 28px -6px rgba(221,201,142,.4)}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0;overflow:hidden}
.err{min-height:1.4em;color:#e9b9b9;font-size:.88rem;text-align:center}

/* plan */
.plan h2{margin-top:10px}
.here{list-style:none;margin-top:14px;display:grid;gap:14px}
.card.start{border-left:4px solid var(--gold-deep)}

.tl{list-style:none;position:relative;margin-top:14px;padding-left:28px}
.tl::before{content:"";position:absolute;left:5px;top:12px;bottom:14px;width:1px;background:rgba(168,133,56,.5)}
.tl li{position:relative;padding:10px 0 12px}
.tl li::before{content:"";position:absolute;left:-28px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--gold-deep);box-shadow:0 0 0 4px rgba(168,133,56,.2)}
.tl .dd{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown);font-weight:600}
.tl .dd span{letter-spacing:.06em;margin-left:6px;font-weight:400}
.tl .dc{font-weight:500;font-size:.98rem;line-height:1.35;color:var(--teal);margin-top:2px}
.tl .dc small{display:block;margin-top:2px;font-weight:300;font-size:.8rem;color:var(--ink);opacity:.75}
.months-h{margin-top:30px;font-size:1.2rem;line-height:1.25;font-weight:500;color:#fff;text-shadow:0 2px 18px rgba(7,7,7,.55)}
.months-h em{font-style:normal}
details{background:var(--cream);color:var(--ink);border-radius:18px;margin-top:10px;box-shadow:0 20px 50px -26px rgba(0,0,0,.75)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:52px;font-weight:400;font-size:.9rem;color:var(--ink)}
summary::-webkit-details-marker{display:none}
summary .pill{flex:none;background:var(--gold);color:var(--teal);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.78rem;letter-spacing:.02em}
summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--gold-deep);border-bottom:2px solid var(--gold-deep);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.progs{list-style:none;padding:2px 18px 14px;display:grid;gap:12px}
.progs b{display:block;font-weight:600;font-size:.95rem;color:var(--teal)}
.progs span{display:block;font-size:.86rem;line-height:1.45;color:var(--ink);font-weight:300}
.progs-note{padding:0 18px 16px;font-size:.85rem;font-weight:600;color:var(--gold-deep)}
.map{font-weight:500;font-size:.95rem;line-height:1.45;color:var(--teal)}

/* offer */
.offer h2{margin-top:10px}
.terms{list-style:none;padding:0}
.terms li{padding:14px 0;border-top:1px solid rgba(168,133,56,.3);font-size:.98rem;line-height:1.55;font-weight:400;color:var(--ink)}
.terms li:first-child{border-top:0;padding-top:0}
.terms .big{display:block;font-weight:600;font-size:clamp(2rem,9vw,2.6rem);line-height:1.05;letter-spacing:-.02em;color:var(--teal);margin-bottom:8px}

/* fixed bottom bar */
.foot{position:absolute;left:0;right:0;bottom:0;z-index:6;max-width:480px;margin:0 auto;padding:30px 22px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(0deg,#070707 62%,rgba(7,7,7,0))}
.foot[hidden]{display:none}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:14px 28px;background:var(--gold);color:#070707;border:0;border-radius:999px;text-decoration:none;text-align:center;font:500 1rem var(--font);letter-spacing:.02em;cursor:pointer;transition:background .25s,transform .25s,opacity .2s}
.btn:hover{background:#e9d9a8;transform:translateY(-2px)}
.btn[disabled]{opacity:.35;pointer-events:none}
.fine{margin-top:12px;text-align:center;font-size:.8rem;color:rgba(246,239,224,.8);font-weight:400}
.sub-link{display:block;margin-top:14px;text-align:center;font-size:.85rem;font-weight:400;color:var(--gold)}

@media (min-width:700px){.card{padding:28px 28px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1}
}
</style>

/* dates are kept as UTC-midnight timestamps, so adding days never drifts across clock changes */
function ukToday(){
  var p={};
  try{
    new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'})
      .formatToParts(new Date(Date.now())).forEach(function(x){p[x.type]=x.value;});
    return Date.UTC(+p.year,+p.month-1,+p.day);
  }catch(e){
    var d=new Date(Date.now());return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  }
}
function fmt(ts){var d=new Date(ts);return d.getUTCDate()+' '+MON[d.getUTCMonth()];}
function isoDate(ts){var d=new Date(ts);return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2);}
/* The same month counting the app uses (lib/entitlements/config.ts membershipMonth), so the
   dates on the plan are the dates the app really opens each programme. */
function memMonth(since,now){
  var a=new Date(since),b=new Date(now);
  var m=(b.getUTCFullYear()-a.getUTCFullYear())*12+(b.getUTCMonth()-a.getUTCMonth());
  if(b.getUTCDate()<a.getUTCDate())m-=1;
  return Math.max(1,m+1);
}
function opensOn(since,n){
  if(n<=1)return since;
  for(var t=since;t<since+400*DAY;t+=DAY){if(memMonth(since,t)>=n)return t;}
  return since;
}
function addMonths(ts,n){
  var d=new Date(ts),y=d.getUTCFullYear(),m=d.getUTCMonth()+n,day=d.getUTCDate();
  var last=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  return Date.UTC(y,m,Math.min(day,last));
}

}
function allowed(n){
  var m=firstMissing();
  if(n>=2&&n<=6&&m&&m<n)return m;
  if(n>=7&&m)return m;
  if(n>=12&&!S.email)return 11;
  return n;
}
function go(n,mode){
  clearTimers();
  stopVoice();
  n=allowed(n);
  step=n;
  if(mode==='push')history.pushState({s:n},'');
  else if(mode==='replace')history.replaceState({s:n},'');
  render();
}
function next(){
  if(step===0)T('confessions_start_begin');
  go(step+1,'push');
}
backEl.addEventListener('click',function(){
  if(history.state&&history.state.s>0)history.back();
  else go(Math.max(0,step-1),'replace');
});
window.addEventListener('popstate',function(e){
  var s=(e.state&&typeof e.state.s==='number')?e.state.s:0;
  go(s,'pop');
});

/* ---------- email ---------- */
function bindMail(){
  var form=$('mailForm');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var email=form.email.value.trim();
    var name=form.firstName.value.trim();
    var err=$('mailErr');err.textContent='';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Please enter a valid email.';form.email.focus();return;}
    S.email=email;S.name=name;
    var btn=$('cta');btn.disabled=true;

    var tags=[TAG_PLAN];
    if(TAG_WHO[S.who])tags.push(TAG_WHO[S.who]);
    if(TAG_STATE[S.state])tags.push(TAG_STATE[S.state]);
    var payload=JSON.stringify({email:email,firstName:name,tagIds:tags,hp_field:form.hp_field.value});

    var moved=false;
    function carryOn(){
      if(moved)return;moved=true;
      go(12,'push');
    }
    T('confessions_start_email',{state:S.state,who:S.who});

    /* same email and answers already sent, no need to post twice */
    if(payload===lastSent){carryOn();return;}

    function attempt(n){
      return fetch('/.netlify/functions/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:payload})
        .then(function(r){return r.json().catch(function(){return {};});})
        .then(function(d){if(d&&d.ok)return d;throw new Error('fail');})
        .catch(function(er){if(n>0){return new Promise(function(res){setTimeout(res,1200);}).then(function(){return attempt(n-1);});}throw er;});
    }
    /* never block the person: whatever happens, they get their plan */
    var guard=setTimeout(carryOn,6000);
    attempt(1).then(function(){lastSent=payload;},function(){}).then(function(){clearTimeout(guard);carryOn();});
  });
}

/* ---------- start ---------- */
/* the quiz can send ?state=...&who=...&email=... : pre-select those answers, ignore anything unknown */
(function(){
  try{
    var q=new URLSearchParams(location.search);
    var st={'braced':'braced','the fade':'fade','reaching':'reaching','melted':'melted'}[(q.get('state')||'').trim().toLowerCase()];
    if(st)S.state=st;
    var w=(q.get('who')||'').trim().toLowerCase();
    if(w==='woman'||w==='man')S.who=w;
    var em=(q.get('email')||'').trim();
    if(em.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))S.email=em;
  }catch(e){}
})();
history.replaceState({s:0},'',location.pathname);
render();
})();
